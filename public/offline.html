<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiarIA · Sin conexión</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c3aed">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    color: white; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    margin: 0; text-align: center; padding: 20px;
  }
  .box { max-width: 400px; }
  .icon { font-size: 72px; margin-bottom: 16px; }
  h1 { font-size: 28px; margin: 0 0 10px; font-weight: 900; }
  p { opacity: 0.9; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
  button {
    background: white; color: #7c3aed;
    border: none; padding: 14px 28px; border-radius: 50px;
    font-weight: 800; font-size: 15px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>Parece que no tienes internet. Revisa tu conexión y vuelve a intentarlo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
